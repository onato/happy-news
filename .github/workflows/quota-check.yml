name: Quota check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # One tiny request: is the daily TTS quota available again?
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
            -d '{"contents":[{"parts":[{"text":"Testing."}]}],
                 "generationConfig":{"responseModalities":["AUDIO"],
                   "speechConfig":{"voiceConfig":{"prebuiltVoiceConfig":{"voiceName":"Kore"}}}}}')
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            python3 -c "
          import json,base64
          d=json.load(open('/tmp/r.json'))
          b=base64.b64decode(d['candidates'][0]['content']['parts'][0]['inlineData']['data'])
          print(f'OK: {len(b)} bytes of PCM ({len(b)/48000:.2f}s) — quota available')"
          else
            head -c 600 /tmp/r.json
          fi
