name: Happy News Collector

on:
  schedule:
    - cron: "0 18 * * *" # ~6am NZST / 7am NZDT daily
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Skip the collection and send a test Telegram message"
        type: boolean
        default: false
      audio_only:
        description: "Skip the collection and rebuild audio from the current feed"
        type: boolean
        default: false

# Only one run at a time — two runs appending to data/news.json would conflict.
concurrency:
  group: happy-news
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      added: ${{ steps.commit.outputs.added }}
      top: ${{ steps.commit.outputs.top }}
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: ${{ !inputs.test_telegram && !inputs.audio_only }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --allowedTools "WebSearch,WebFetch,Read,Write,Bash(python3:*)"
            --max-turns 150
          prompt: |
            You collect genuinely uplifting news and add it to a feed. Your output is a
            JSON file that a static site renders as a news feed. Quality over quantity —
            a short feed of real good news beats a long feed padded with filler.

            ## 1. Read the existing feed

            Read data/news.json. It has the shape:
              { "updated": "<ISO8601>", "stories": [ {...}, ... ] }
            Stories are newest-first. Note the headlines and `url`s already present —
            you must not add the same story twice.

            ## 2. Find happy news from the last 30 hours

            Use WebSearch to find genuinely positive, uplifting stories published in the
            LAST 30 HOURS. This runs daily, so a wider window fills the feed with stories
            that are already a day or two old by the time anyone reads them — freshness
            matters more than volume here. Search several distinct areas so the feed is
            varied — aim for a mix across categories such as:
              - Science & discovery (breakthroughs, space, research results)
              - Health & medicine (treatments, recoveries, public-health wins)
              - Environment & conservation (species recovery, restoration, clean energy)
              - Community & kindness (people helping people, local heroes)
              - Culture, sport & human achievement
              - Animals & wildlife

            Run a separate search per category rather than one generic "good news" search —
            generic searches mostly return aggregator listicles, which you should skip.

            These outlets reliably publish qualifying stories — searching them by name
            (e.g. `site:positive.news coral reef`, or "Positive News <topic>") often beats
            an open search, which tends to surface listicles:
              - Positive News: www.positive.news
              - Reasons to be Cheerful: reasonstobecheerful.world
              - The Optimist Daily: www.optimistdaily.com
              - Good News Network: goodnewsnetwork.org
              - The Daily Encourager: dailyencourager.co.nz
              - Upworthy: upworthy.com
              - The Happy Newspaper: thehappynewspaper.com
              - BBC, The Guardian, Reuters, AP News, NPR, Sky News
              - Nature, ScienceDaily, New Scientist, Phys.org, NASA
              - Mongabay, Yale e360 (environment); STAT News (health)
              - RNZ, NZ Herald, Stuff (New Zealand)

            Treat that list as a starting point, not a limit — a genuinely good story from
            any credible outlet qualifies. Use open search as well, especially for
            community and animal stories, which are usually local news.

            What qualifies as happy news:
            - Something genuinely good HAPPENED. A concrete outcome, not a plan or a hope.
            - It stands on its own as good news, not "less bad than expected".

            Reject:
            - Tragedy with a silver lining (a disaster where some people survived)
            - Crime, war, or disaster stories framed positively
            - Pure promotion: product launches, company PR, fundraising announcements
            - Listicles and aggregators ("20 good news stories this week")
            - Anything whose good outcome is speculative or not yet realised

            Verify recency by publication date: search engines routinely resurface old
            articles. Confirm each story's actual publication date from result metadata,
            or by fetching the article with WebFetch when unclear. A story only qualifies
            if it was PUBLISHED within the last ~30 hours. Discard stories whose date you
            cannot verify.

            Note the current date and time at the start of the run and measure the window
            from that — do not assume the previous calendar day.

            Prefer the ORIGINAL publisher over syndicated copies or aggregators — the feed
            links readers to the source.

            ## 3. Deduplicate (hard requirement)

            The feed must never show the same story twice. Drop anything covering the same
            underlying EVENT as a story already in data/news.json, even if the headline,
            outlet, or URL differs (syndication, day-2 coverage, follow-up commentary).
            Only include a follow-up when there is a genuinely new development, and lead
            with what is new.

            Aim for 4-8 new stories. The 30-hour window is deliberately tight, so some
            days will genuinely yield only two or three — that is a correct outcome, not a
            failure. Never pad the feed with weaker stories, older stories, or listicles to
            hit a number. If you find none, make no changes and finish quietly.

            Work within a budget: roughly one or two searches per category. Do not keep
            hunting for more stories once you have worked through the categories — a
            short feed of verified stories is the goal, and a thin day is an acceptable
            outcome. Spend your remaining turns going DEEP on the stories you have
            (fetching them so you can write a proper `narrative`) rather than wide on
            finding more. Six well-told stories make a better digest than ten thin ones.

            ## 4. Save as you go (important)

            You have a limited number of turns. Do NOT save everything at the end — if you
            run out, all of it is lost. Instead, write the file after finishing EACH
            category, so the feed always holds everything verified so far. Rewriting the
            file is cheap; losing an hour of searching is not.

            Follow the format in the next section every time you write.

            ## 5. Feed format

            Prepend the new stories (newest first) to the `stories` array, keeping the
            existing entries below them. Each story object must have exactly these fields:

              {
                "headline":  "<the story's headline, plain text, no outlet name>",
                "summary":   "<2-3 sentences on what happened and why it's good news>",
                "narrative": "<4-6 paragraphs, IN YOUR OWN WORDS, separated by blank lines>",
                "url":       "<link to the original article>",
                "source":    "<publication name, e.g. 'BBC News'>",
                "published": "<ISO8601 publication date of the article>",
                "category":  "<one of: Science, Health, Environment, Community, Culture, Animals>",
                "added":     "<ISO8601 timestamp of this run>",
                "image":     "<absolute https URL of the article's lead image, or omit>"
              }

            `summary` is what the website's story cards show — keep it to the 2-3
            tight sentences it is today. `narrative` is what gets READ ALOUD in the
            daily audio digest, and it is the one that should be generous: 4-6
            paragraphs, around 300-500 words, that tell the story properly for someone
            listening with their eyes elsewhere. Cover what happened, who it happened
            to, the detail and context a headline has to drop, and why it is genuinely
            good news. Write it to be heard: full sentences, no bullet points, no
            markdown, no URLs read aloud. Separate paragraphs with a blank line.

            Write `narrative` IN YOUR OWN WORDS. Do not copy or lightly reword the
            article's sentences — this is a retelling for listeners, not a reproduction
            of someone else's copy, and the feed's whole premise is that it sends
            readers on to the original. Quote at most one short sentence, and only when
            the exact wording genuinely matters (someone's own words about their own
            experience). You will usually need to WebFetch the article to have enough
            detail to write this well; that is a good use of a turn, unlike fetching
            merely to confirm a date.

            If a story is too thin to support 4-6 paragraphs without padding, write
            fewer — three solid paragraphs beat six with filler. `narrative` is
            optional: omit it entirely rather than padding, and the digest falls back to
            reading `summary` for that story.

            For `image`, use the article's Open Graph image (the `og:image` meta tag) when
            you have already fetched the page with WebFetch, or an image URL given in the
            search results. Do NOT spend extra turns fetching pages just to find one — the
            feed renders fine without images, and a missing `image` is always acceptable.
            It must be an absolute `https://` URL pointing directly at an image file; omit
            the field entirely rather than guessing, using a page URL, or inventing one.

            Set the top-level `updated` field to the current UTC time.

            Cap the feed at the 200 most recent stories — drop the oldest beyond that.

            Write the file with the Write tool. It must be valid JSON — after writing,
            verify with:
              python3 -c "import json;d=json.load(open('data/news.json'));print(len(d['stories']),'stories')"
            If that command fails, fix the file until it passes. Do not finish with a
            broken feed: the site reads this file directly.

      # The action exits green even when Claude Code errors (e.g. bad auth),
      # so check the execution log ourselves and fail the run loudly.
      - name: Fail if the collection errored
        if: ${{ !inputs.test_telegram && !inputs.audio_only }}
        run: |
          file="${{ steps.claude.outputs.execution_file }}"
          if [ ! -f "$file" ] || [ "$(jq -r 'last | .is_error' "$file")" != "false" ]; then
            echo "::error::Claude collection reported an error — see the step above."
            exit 1
          fi

      # Guard the site against a malformed feed: never commit JSON the page can't read.
      - name: Validate the feed
        if: ${{ !inputs.test_telegram && !inputs.audio_only }}
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('data/news.json'))
          stories = d['stories']
          required = {'headline', 'summary', 'url', 'source', 'published', 'category', 'added'}
          for i, s in enumerate(stories):
              missing = required - s.keys()
              if missing:
                  sys.exit(f"story {i} missing fields: {sorted(missing)}")
              if not str(s['url']).startswith(('http://', 'https://')):
                  sys.exit(f"story {i} has a non-http url: {s['url']!r}")
              # `image` is optional, but must be a real https URL when present.
              img = s.get('image')
              if img is not None and not str(img).startswith('https://'):
                  sys.exit(f"story {i} has a non-https image: {img!r}")
              # `narrative` is optional too — the digest falls back to `summary`.
              # When present it must be prose the narrator can read: a string, long
              # enough to be a real retelling rather than a stray copy of the summary.
              nar = s.get('narrative')
              if nar is not None:
                  if not isinstance(nar, str) or len(nar.strip()) < 200:
                      sys.exit(f"story {i} has a too-short narrative: {str(nar)[:80]!r}")
                  if 'http://' in nar or 'https://' in nar:
                      sys.exit(f"story {i} has a URL in its narrative (it is read aloud)")
          urls = [s['url'] for s in stories]
          if len(urls) != len(set(urls)):
              sys.exit("duplicate urls in feed")
          print(f"feed OK — {len(stories)} stories")
          PY

      - name: Commit new stories
        id: commit
        if: ${{ !inputs.test_telegram && !inputs.audio_only }}
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No new stories today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count how many stories were added, for the Telegram ping.
          before=$(git show HEAD:data/news.json | python3 -c "import json,sys;print(len(json.load(sys.stdin)['stories']))")
          after=$(python3 -c "import json;print(len(json.load(open('data/news.json'))['stories']))")
          added=$(( after - before ))
          [ "$added" -lt 0 ] && added=0

          top=$(python3 -c "import json;print(json.load(open('data/news.json'))['stories'][0]['headline'])")

          echo "changed=true"    >> "$GITHUB_OUTPUT"
          echo "added=$added"    >> "$GITHUB_OUTPUT"
          echo "top=$top"        >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "feed: add $added stor$([ "$added" = 1 ] && echo y || echo ies) — $(date -u +%Y-%m-%d)"
          git push

      # The story and episode pings both live in the `notify` job at the bottom,
      # which runs after Pages has published — a link sent from here would point
      # at a site that does not have the new stories on it yet.
      - name: Send the Telegram test message
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          curl -sf https://api.telegram.org/bot"$TELEGRAM_BOT_TOKEN"/sendMessage \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="🔔 Test message from the happy-news workflow. Telegram wiring works." > /dev/null
          echo "Test message sent."

      - name: Notify Telegram of failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          curl -sf https://api.telegram.org/bot"$TELEGRAM_BOT_TOKEN"/sendMessage \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="⚠️ Happy news collection FAILED — no new stories today. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null

  # Narrate the new stories and publish them as a podcast episode.
  #
  # Best-effort by design: every step continues on error, so a Gemini outage or a
  # quota blip costs the audio only — the text feed still deploys. It runs
  # BETWEEN collect and deploy because podcast.xml and data/episodes.json have to
  # be committed before Pages uploads the site, or the episode would appear a day
  # late.
  audio:
    needs: collect
    if: ${{ always() && (needs.collect.outputs.changed == 'true' || inputs.audio_only) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # release assets + committing the feed
    outputs:
      published: ${{ steps.publish.outcome }}
      episode: ${{ steps.digest.outputs.episode }}
      minutes: ${{ steps.digest.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the feed commit the collect job just pushed

      # Not on the ubuntu-24.04 runner image — packages were trimmed from it to
      # hold the free-disk-space SLA. digest.py shells out to both binaries.
      - name: Install ffmpeg
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # The narrator. Neural but ONNX-based, so it installs in about a minute
      # with no PyTorch, and it runs entirely on the runner — no API, no quota,
      # no outage. Gemini was tried first for several weeks and never once
      # narrated an episode: its free tier (~10 requests a day) ran out before a
      # digest finished, and when it had quota it returned 500s instead.
      - name: Install piper
        continue-on-error: true
        run: |
          python3 -m pip install --quiet piper-tts
          python3 -m piper.download_voices en_GB-alba-medium

      - name: Narrate the digest
        id: digest
        continue-on-error: true
        run: |
          mkdir -p build/audio

          # `|| code=$?` matters: the step runs under `bash -e`, so a bare call
          # would abort the step before the exit code could be inspected.
          code=0
          python3 scripts/digest.py --engine piper --out build/audio \
            > build/audio/episode.json || code=$?

          if [ "$code" -eq 75 ]; then
            echo "::warning::No narration available today."
            echo "episode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          engine=piper
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::error::digest.py failed with code $code"
            exit 1
          fi

          # Tolerate an empty or malformed file rather than crashing the step —
          # a missing episode is a normal outcome, not an error.
          python3 -c '
          import json
          try:
              episode = json.load(open("build/audio/episode.json"))
          except Exception:
              episode = {}
          print("episode=" + str(episode.get("date", "none")))
          print("title=" + str(episode.get("title", "")))
          print("minutes=" + str(round(episode.get("duration", 0) / 60)))
          ' >> "$GITHUB_OUTPUT"

      - name: Publish the episode
        id: publish
        if: steps.digest.outcome == 'success' && steps.digest.outputs.episode != 'none'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_episode.sh build/audio/episode.json

      - name: Prune episodes older than a month
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prune_episodes.sh

      # Runs even when today's narration failed, so an expired episode still
      # leaves the feed on schedule.
      - name: Rebuild the podcast feed
        if: always()
        continue-on-error: true
        run: |
          site="${{ vars.FEED_URL }}"
          python3 scripts/podcast_rss.py --site "${site:-https://www.onato.com/happy-news/}"

      - name: Commit the podcast feed
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcast.xml data/episodes.json
          # Check the STAGED diff: on the first run these files are new, and
          # `git diff` alone ignores untracked files, so the commit was skipped.
          if git diff --cached --quiet; then
            echo "No podcast changes."
            exit 0
          fi
          git commit -m "audio: episode $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push

  # Commits made with GITHUB_TOKEN don't trigger other workflows (GitHub's
  # anti-recursion rule), so pages.yml never fires for the feed commit —
  # this run has to publish the new stories itself.
  #
  # `always()` is load-bearing: without it, a failed or skipped `audio` job would
  # cascade and skip the deploy, so a Gemini outage would stop the NEWS FEED from
  # publishing. Audio is best-effort; the text feed is not.
  deploy:
    needs: [collect, audio]
    if: ${{ always()
      && needs.collect.result == 'success'
      && (needs.collect.outputs.changed == 'true' || inputs.audio_only)
      && needs.audio.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the feed and podcast commits this run just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # Every ping to the phone happens here, and this job runs LAST — after Pages
  # has published. Notifying from `collect`/`audio` (as this used to) linked to a
  # site that was still serving yesterday's feed for another minute or two, so
  # tapping the notification the moment it arrived showed nothing new.
  notify:
    needs: [collect, audio, deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      FEED_URL: ${{ vars.FEED_URL }}
    steps:
      - name: Notify Telegram of new stories
        if: ${{ needs.collect.outputs.changed == 'true' }}
        env:
          ADDED: ${{ needs.collect.outputs.added }}
          TOP: ${{ needs.collect.outputs.top }}
        run: |
          curl -sf https://api.telegram.org/bot"$TELEGRAM_BOT_TOKEN"/sendMessage \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="🌻 $ADDED new happy stor$([ "$ADDED" = 1 ] && echo y || echo ies) today

          $TOP

          ${FEED_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}}" > /dev/null
          echo "Notified: $ADDED stories."

      - name: Notify Telegram of the episode
        if: ${{ needs.audio.outputs.published == 'success'
          && needs.audio.outputs.episode != 'none'
          && needs.audio.outputs.episode != '' }}
        continue-on-error: true
        env:
          MINUTES: ${{ needs.audio.outputs.minutes }}
        run: |
          # Quiet: the story ping already buzzed the phone moments ago.
          curl -sf https://api.telegram.org/bot"$TELEGRAM_BOT_TOKEN"/sendMessage \
            --data-urlencode chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode disable_notification=true \
            --data-urlencode text="🎧 Today's digest is ready — ${MINUTES} min

          ${FEED_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}}" > /dev/null
