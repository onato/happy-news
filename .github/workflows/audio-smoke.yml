# Temporary: proves the Gemini TTS call, PCM->mp3 encode, and chapter offsets
# work on a runner with the real secret. Deleted once verified.
name: Audio smoke test
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Narrate the current feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          mkdir -p build/audio
          python3 scripts/digest.py --out build/audio > build/audio/episode.json
          code=$?
          set -e
          echo "exit=$code"
          echo "--- episode.json ---"
          cat build/audio/episode.json
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "--- ffprobe ---"
          ffprobe -hide_banner -v error -show_entries format=duration,bit_rate:stream=sample_rate,channels \
            -of default=nw=1 build/audio/*.mp3
          echo "--- chapter drift check ---"
          python3 - <<'PY'
          import json, subprocess, glob
          ep = json.load(open("build/audio/episode.json"))
          mp3 = glob.glob("build/audio/*.mp3")[0]
          total = float(subprocess.run(["ffprobe","-v","error","-show_entries","format=duration",
              "-of","default=nw=1:nk=1",mp3],capture_output=True,text=True).stdout)
          last = ep["chapters"][-1]
          print(f"total={total:.3f}s  last chapter ends={last['start']+last['duration']:.3f}s")
          print(f"drift={abs(total-(last['start']+last['duration'])):.3f}s (gap of 0.6s expected at the outro)")
          for c in ep["chapters"]:
              print(f"  {c['start']:7.2f}s  {c['headline'][:60]}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: digest-audio
          path: build/audio/*.mp3
