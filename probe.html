<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Probe</title>
<style>
  body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin:0; padding:12px 12px 340px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  td { border-bottom:1px solid #ddd; padding:6px 4px; }
  td:last-child { text-align:right; font-weight:700; }
  h1 { font-size:17px; margin:0 0 10px; }
  /* Styled exactly like the real player bar. */
  #bar { position:fixed; bottom:0; left:0; right:0; background:#1a6c3d; color:#fff;
         padding-bottom: env(safe-area-inset-bottom, 0px); z-index:5; }
  #bar .in { padding:10px 14px; font-weight:700; }
</style>
<h1>Viewport probe</h1>
<p>Green bar = the real player's geometry. Screenshot in <b>Safari</b> and in the
<b>Telegram browser</b>.</p>
<table id="t"></table>
<div id="bar"><div class="in">FIXED BAR</div></div>
<script>
  const d = document.createElement('div');
  d.style.cssText='position:fixed;visibility:hidden;top:0;left:0;width:1px';
  document.body.append(d);
  const u = v => { d.style.height=v; return Math.round(parseFloat(getComputedStyle(d).height)); };
  const b = document.getElementById('bar').getBoundingClientRect();
  const rows = {
    'screen.height': screen.height,
    'innerHeight': innerHeight,
    'visualViewport.height': visualViewport ? Math.round(visualViewport.height) : 'n/a',
    'clientHeight': document.documentElement.clientHeight,
    '100vh': u('100vh'), '100svh': u('100svh'), '100lvh': u('100lvh'), '100dvh': u('100dvh'),
    'INSET-BOTTOM': u('env(safe-area-inset-bottom, 0px)'),
    'inset-top': u('env(safe-area-inset-top, 0px)'),
    'BAR.bottom': Math.round(b.bottom),
    'BAR gap to innerHeight': Math.round(innerHeight - b.bottom),
    'BAR gap to screen.height': Math.round(screen.height - b.bottom),
    'dpr': devicePixelRatio,
  };
  document.getElementById('t').innerHTML =
    Object.entries(rows).map(([k,v]) =>
      `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  d.remove();
</script>
