<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Probe 2</title>
<style>
  body { font:15px/1.4 -apple-system,system-ui,sans-serif; margin:0; padding:12px 12px 340px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  td { border-bottom:1px solid #ddd; padding:6px 4px; }
  td:last-child { text-align:right; font-weight:700; }
  h1 { font-size:17px; margin:0 0 6px; }
  p { margin:0 0 10px; color:#444; }

  /* A: the current shipped approach — fixed, bottom:0. */
  #A { position:fixed; bottom:0; left:0; right:0; background:#1a6c3d; color:#fff; z-index:5; }
  #A .in { padding:10px 14px; font-weight:700; }

  /* B: same, but with a tall pseudo-element hanging below it. */
  #A::after { content:""; position:absolute; top:100%; left:0; right:0;
              height:300px; background:#c0392b; }

  /* C: a separate fixed filler, not a child of the bar. */
  #C { position:fixed; bottom:-300px; left:0; right:0; height:300px;
       background:#8e44ad; z-index:4; }
</style>
<h1>Probe 2 — which fills the gap?</h1>
<p><b>Green</b> = bar. <b>Red</b> = pseudo-element under it.
<b>Purple</b> = separate fixed filler. Whichever colour reaches the screen
bottom in the Telegram browser is the fix.</p>
<table id="t"></table>
<div id="A"><div class="in">BAR (green)</div></div>
<div id="C"></div>
<script>
  const d=document.createElement('div');
  d.style.cssText='position:fixed;visibility:hidden;top:0;left:0;width:1px';
  document.body.append(d);
  const u=v=>{d.style.height=v;return Math.round(parseFloat(getComputedStyle(d).height));};
  const A=document.getElementById('A').getBoundingClientRect();
  const rows={
    'screen.height':screen.height,'innerHeight':innerHeight,
    '100lvh':u('100lvh'),'100svh':u('100svh'),
    'lvh > innerHeight?':u('100lvh')>innerHeight?'YES (Safari-like)':'no (clipped)',
    'INSET-BOTTOM':u('env(safe-area-inset-bottom, 0px)'),
    'BAR.bottom':Math.round(A.bottom),
    'gap to screen':Math.round(screen.height-A.bottom),
  };
  document.getElementById('t').innerHTML=Object.entries(rows)
    .map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  d.remove();
</script>
