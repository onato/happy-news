<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy News</title>
  <meta name="description" content="A daily feed of genuinely good news, collected automatically.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
  <link rel="alternate" type="application/rss+xml" title="Happy News podcast" href="podcast.xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1><span aria-hidden="true">🌻</span> Happy News</h1>
      <p class="tagline">Genuinely good things that actually happened.</p>
    </div>
  </header>

  <!-- Revealed by js/episode.js only when there's an episode to play. -->
  <div class="player" id="player" hidden>
    <div class="player-inner">
      <button class="player-toggle" id="player-toggle" type="button"
              aria-label="Play the digest" aria-pressed="false"><span class="glyph">▶</span></button>
      <span class="player-title" id="player-title"></span>
      <input class="player-seek" id="player-seek" type="range"
             min="0" max="0" value="0" step="1" aria-label="Seek">
      <span class="player-time" id="player-time">0:00</span>
      <a class="player-rss" href="podcast.xml" title="Subscribe in a podcast app">Subscribe</a>
      <audio id="player-audio" preload="none"></audio>
    </div>
  </div>

  <!-- Shown by js/episode.js while the playing story is scrolled off screen. -->
  <button class="player-jump" id="player-jump" type="button" hidden
          aria-label="Scroll to the playing story"><span class="glyph">↓</span> Now playing</button>

  <nav class="filters" id="filters" aria-label="Filter by category"></nav>

  <main id="feed" class="feed" aria-live="polite">
    <p class="state">Loading the good news…</p>
  </main>

  <footer class="footer">
    <p>
      Collected daily by <a href="https://claude.com/claude-code">Claude Code</a>.
      Every story links to its original publisher.
    </p>
    <p id="updated" class="updated"></p>
  </footer>

  <script src="js/episode.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
