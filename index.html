<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover is load-bearing on iOS: without it the layout viewport
       is confined to the safe region, which clips the fixed player bar at the top
       of the browser's bottom toolbar and forces every env(safe-area-inset-*) to
       report 0. With it the page extends under the chrome, the bar reaches the
       glass, and the insets carry real values. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy News</title>
  <meta name="description" content="A daily feed of genuinely good news, collected automatically.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
  <link rel="alternate" type="application/rss+xml" title="Happy News podcast" href="podcast.xml">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Applies a saved theme choice before first paint so there's no flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-text">
        <h1><span aria-hidden="true">🌻</span> Happy News</h1>
        <p class="tagline">Genuinely good things that actually happened.</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button"
              aria-label="Switch theme"><span class="glyph" aria-hidden="true">◐</span><span class="auto-badge" aria-hidden="true">A</span></button>
    </div>
  </header>

  <!-- Revealed by js/episode.js only when there's an episode to play. -->
  <div class="player" id="player" hidden>
    <div class="player-inner">
      <button class="player-toggle" id="player-toggle" type="button"
              aria-label="Play the digest" aria-pressed="false"><span class="glyph">▶</span></button>
      <!-- Inline SVG, not ⏮/⏭: iOS renders those codepoints as full-colour
           Apple emoji, which ignores currentColor and looks boxed in the button. -->
      <button class="player-skip" id="player-prev" type="button"
              aria-label="Previous story"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M14.5 4v8L9 8l5.5-4Z"/><path d="M8.5 4v8L3 8l5.5-4Z"/><rect x="1" y="4" width="1.6" height="8" rx=".7"/>
        </svg></button>
      <button class="player-skip" id="player-next" type="button"
              aria-label="Next story"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M1.5 4v8L7 8 1.5 4Z"/><path d="M7.5 4v8L13 8 7.5 4Z"/><rect x="13.4" y="4" width="1.6" height="8" rx=".7"/>
        </svg></button>
      <span class="player-title" id="player-title"></span>
      <!-- The ticks layer marks where each story starts; js/episode.js fills it. -->
      <div class="player-track" id="player-track">
        <input class="player-seek" id="player-seek" type="range"
               min="0" max="0" value="0" step="1" aria-label="Seek">
        <div class="player-ticks" id="player-ticks" aria-hidden="true"></div>
      </div>
      <span class="player-time" id="player-time">0:00</span>
      <a class="player-rss" href="podcast.xml" title="Subscribe in a podcast app">Subscribe</a>
      <audio id="player-audio" preload="none"></audio>
    </div>
  </div>

  <!-- Shown by js/episode.js while the playing story is scrolled off screen. -->
  <button class="player-jump" id="player-jump" type="button" hidden
          aria-label="Scroll to the playing story"><span class="glyph">↓</span> Now playing</button>

  <nav class="filters" id="filters" aria-label="Filter by category"></nav>

  <main id="feed" class="feed" aria-live="polite">
    <p class="state">Loading the good news…</p>
  </main>

  <!-- Revealed by js/feed.js when there are older stories held back. -->
  <div class="more-wrap">
    <button class="more" id="more" type="button" hidden></button>
  </div>

  <footer class="footer">
    <p>
      Collected daily by <a href="https://claude.com/claude-code">Claude Code</a>.
      Every story links to its original publisher.
    </p>
    <p id="updated" class="updated"></p>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/episode.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
